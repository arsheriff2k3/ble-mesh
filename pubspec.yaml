name: ble_mesh
description: >-
  Flutter plugin providing a dual-role Bluetooth Low Energy transport for
  offline mesh chat. The native layer moves links and frames; routing, queues,
  protocol, and crypto are implemented in shared Dart.
version: 0.1.0
publish_to: none
topics:
  - bluetooth
  - ble
  - mesh
  - networking
  - offline

environment:
  sdk: ^3.13.0
  flutter: '>=3.32.0'

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.2

flutter:
  plugin:
    platforms:
      android:
        package: dev.blemesh.ble_mesh
        pluginClass: BleMeshPlugin
      ios:
        pluginClass: BleMeshPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: BleMeshPlugin
        sharedDarwinSource: true
